name: Catat sublevel

# Owner 26 Okt 2026: dua cek dipisah perannya. Mengecek versi terbaru (termasuk rilis ACK baru) hanya
# di **Cek pembaruan**; workflow ini hanya mencatat. Tombol manual, tanpa jadwal atau pemicu otomatis:
# hasil run Cogan Kernel Builder (run_id, atau run terakhir dari main yang sudah selesai) masuk
# kernel/sublevels.json dan tabel README (ID/EN), langsung di main. Catatan, bukan kunci. Workflow ini
# tidak memulai build apa pun.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Kosong = catat run Builder terakhir dari main; isi ID run Builder = catat run itu / empty = record the latest Builder run from main; a Builder run ID = record that run"
        type: string
        default: ""

concurrency:
  group: catat-sublevel
  cancel-in-progress: false

jobs:
  catat:
    name: Catat / record
    runs-on: ubuntu-latest
    permissions:
      actions: read    # the Builder's artifacts
      contents: write  # kernel/sublevels.json and the README tables on main
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Run Builder / Builder run
        id: run
        run: |
          set -euo pipefail
          run="$RUN_ID"
          if [ -z "$run" ]; then
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-kernel.yml --branch main \
              --event workflow_dispatch --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          [[ -z "$run" || "$run" =~ ^[0-9]+$ ]] || { echo "::error::run_id: angka / a number"; exit 1; }
          echo "id=$run" >> "$GITHUB_OUTPUT"
      # gh keeps every build-info-* in a folder of its own, also when the run has only one build
      # (download-artifact puts a lone match straight into info/, and the build was not recorded).
      - name: Info build / build info
        if: steps.run.outputs.id != ''
        continue-on-error: true
        env:
          RUN: ${{ steps.run.outputs.id }}
        run: gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --pattern 'build-info-*' --dir info
      - uses: actions/download-artifact@v8.0.2
        if: steps.run.outputs.id != ''
        continue-on-error: true
        with:
          pattern: snapshots-*
          path: snapshots
          merge-multiple: true
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Catat / record
        id: catat
        if: steps.run.outputs.id != ''
        env:
          RUN: ${{ steps.run.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p info snapshots
          # Artifacts last 90 days: an older run has nothing left to record.
          compgen -G "info/build-info-*" > /dev/null && echo "found=true" >> "$GITHUB_OUTPUT" || echo "found=false" >> "$GITHUB_OUTPUT"
          python3 kernel/sublevels.py record --info info --snapshots snapshots --run "$RUN" | tee recorded.txt
      - name: Simpan ke main / save to main
        id: simpan
        if: steps.catat.outcome == 'success'
        env:
          RUN: ${{ steps.run.outputs.id }}
        run: |
          set -euo pipefail
          git diff --quiet -- README.md README.en.md && echo "readme=false" >> "$GITHUB_OUTPUT" \
            || echo "readme=true" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet; then
            git config user.name Cogan
            git config user.email 79615344+cogan17@users.noreply.github.com
            git add kernel/sublevels.json README.md README.en.md
            git commit -q -m "docs(sublevel): catat hasil Builder run $RUN"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
      - name: Ringkasan / summary
        if: always()
        env:
          RUN: ${{ steps.run.outputs.id }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          CATAT: ${{ steps.catat.outcome }}
          FOUND: ${{ steps.catat.outputs.found }}
          SIMPAN: ${{ steps.simpan.outcome }}
          README: ${{ steps.simpan.outputs.readme }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
          {
            echo "## 📝 Catat sublevel / record sublevels"
            echo
            if [ "$RUN_OUTCOME" != "success" ]; then
              echo "- 🇮🇩 ❌ Run Builder tidak bisa ditentukan (run_id harus angka); lihat pesan error di atas."
              echo "- 🇬🇧 ❌ Could not determine the Builder run (run_id must be a number); see the error above."
            elif [ -z "$RUN" ]; then
              echo "- 🇮🇩 ℹ️ Belum ada run Builder dari main yang selesai untuk dicatat."
              echo "- 🇬🇧 ℹ️ No finished Builder run from main to record yet."
            elif [ "$CATAT" != "success" ]; then
              echo "- 🇮🇩 ❌ Gagal mencatat [run $RUN]($run_url); lihat pesan error di atas."
              echo "- 🇬🇧 ❌ Could not record [run $RUN]($run_url); see the error above."
            elif [ "$FOUND" != "true" ]; then
              echo "- 🇮🇩 ℹ️ [Run $RUN]($run_url) tidak punya hasil build lagi (artefak hanya bertahan 90 hari, atau run gagal sebelum build)."
              echo "- 🇬🇧 ℹ️ [Run $RUN]($run_url) has no build results left (artifacts last 90 days, or the run failed before any build)."
            elif [ "$README" = "true" ]; then
              echo "- 🇮🇩 ✅ Hasil [run $RUN]($run_url) dicatat; tabel sublevel README diperbarui."
              echo "- 🇬🇧 ✅ [Run $RUN]($run_url) recorded; the README sublevel table is updated."
            else
              echo "- 🇮🇩 ✅ [Run $RUN]($run_url) sudah tercatat; tabel README tetap."
              echo "- 🇬🇧 ✅ [Run $RUN]($run_url) is already recorded; the README table stays."
            fi
            echo "- 🇮🇩 ℹ️ Versi terbaru (termasuk rilis ACK baru) dicek lewat **Cek pembaruan**; workflow ini tidak memulai build."
            echo "- 🇬🇧 ℹ️ Newest versions (new ACK releases too) are checked by **Cek pembaruan**; this workflow starts no build."
            if [ "$SIMPAN" = "failure" ]; then
              echo "- 🇮🇩 ❌ Catatan gagal disimpan ke main; lihat pesan error di atas."
              echo "- 🇬🇧 ❌ Could not save the record to main; see the error above."
            fi
            if [ -s recorded.txt ]; then
              echo
              sed 's/^/    /' recorded.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
