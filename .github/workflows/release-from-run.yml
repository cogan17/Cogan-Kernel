name: Rilis dari run

# Publishes one green Cogan Kernel Builder run of main as a release (like WildKernel's Release From
# Run), including both root managers together. Keep each build's metadata separate and check every
# KMI gate and kernel digest. Tick "diuji di HP" only if the owner tested every included variant.
# Every version keeps its own release; an existing tag stops the run. Artifacts last 90 days.
# GITHUB_TOKEN only; the tag rule in Terbitkan avoids the 403 on builds with other workflow files.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID run Builder yang hijau, satu atau kedua root manager / green builder run ID (one or both root managers)"
        required: true
        type: string
      release_type:
        description: "Pre-Release atau Release (Release = Latest)"
        type: choice
        default: "Pre-Release"
        options:
          - "Pre-Release"
          - "Release"
      diuji_di_hp:
        description: "Semua varian kernel di run ini sudah diuji owner di HP / all variants tested by the owner on the phone"
        type: boolean
        default: false
      catatan:
        description: "Catatan tambahan (opsional; \\n = baris baru) / extra note"
        type: string
        default: ""
      teks_saja:
        description: "Buat catatan & teks Telegram saja, tanpa menerbitkan rilis / notes and Telegram text only"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: release-from-run
  cancel-in-progress: false

jobs:
  release:
    name: Rilis dari run ${{ inputs.run_id }} (${{ inputs.release_type }})
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.run_id }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      TESTED: ${{ inputs.diuji_di_hp }}
      NOTE: ${{ inputs.catatan }}
      TEXT_ONLY: ${{ inputs.teks_saja }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Periksa run / check the run
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo "::error::run_id: angka / a number"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          python3 - <<'PY'
          import json
          run = json.load(open("run.json"))
          want = {"conclusion": "success", "head_branch": "main", "path": ".github/workflows/build-kernel.yml"}
          bad = [f"{k} {run.get(k)!r} (harus / must be {v!r})" for k, v in want.items() if run.get(k) != v]
          if bad:
              raise SystemExit("Run tidak bisa dirilis / cannot be released: " + "; ".join(bad))
          PY

      - name: Unduh file / download the files
        run: |
          set -euo pipefail
          mkdir files info
          # The numbered files are unarchived artifacts: fetch each one by ID, as it is, and check its digest
          # (gh run download would unpack the kernel ZIP itself).
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name, (.digest // "")] | @tsv' > artifacts.tsv
          declare -A downloaded=()
          while IFS=$'\t' read -r id name digest; do
            case "$name" in
              [1-6]-*) if [ "${downloaded[$name]+yes}" = yes ]; then
                         [ "${downloaded[$name]}" = "$digest" ] \
                           || { echo "::error::$name: artifact bernama sama berbeda isi / same artifact name, different contents"; exit 1; }
                         continue
                       fi
                       gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "files/$name"
                       # An unarchived artifact may still arrive wrapped in a ZIP that holds only itself.
                       if [ "sha256:$(sha256sum "files/$name" | cut -d' ' -f1)" != "$digest" ] \
                          && [ "$(unzip -Z1 "files/$name" 2>/dev/null)" = "$name" ]; then
                         unzip -p "files/$name" "$name" > unwrapped && mv unwrapped "files/$name"
                       fi
                       [ "sha256:$(sha256sum "files/$name" | cut -d' ' -f1)" = "$digest" ] \
                         || { echo "::error::$name: SHA256 berbeda dari artifact / differs from the artifact"; exit 1; }
                       downloaded["$name"]="$digest" ;;
              build-info-*) gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > info.zip
                            unzip -q info.zip build.env -d "info/$name" ;;
            esac
          done < artifacts.tsv
          tested=(); [ "$TESTED" = "true" ] && tested=(--tested)
          preview=(); [ "$TEXT_ONLY" = "true" ] && preview=(--text-only)
          sha="$(python3 -c 'import json; print(json.load(open("run.json"))["head_sha"])')"
          python3 -m kernel.release_from_run info files --repo "$GITHUB_REPOSITORY" "${tested[@]}" --note "$NOTE" \
            --sha "$sha" --telegram telegram "${preview[@]}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > notes.md
          ls -la files

      - name: Terbitkan / publish
        if: ${{ !inputs.teks_saja }}
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^RELEASE=//p' info/release.env)"
          title="$(sed -n 's/^RELEASE_NAME=//p' info/release.env)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Rilis $tag sudah ada; rilis tidak pernah ditimpa / release $tag exists and is never replaced"
            exit 1
          fi
          sha="$(python3 -c 'import json; print(json.load(open("run.json"))["head_sha"])')"
          # GITHUB_TOKEN cannot tag a commit whose .github/workflows differ from this run's (HTTP 403):
          # then the tag goes on this run's commit; the notes still link the build run.
          workflows_at() { gh api "repos/$GITHUB_REPOSITORY/contents/.github?ref=$1" --jq '.[] | select(.name == "workflows") | .sha'; }
          there="$(workflows_at "$sha")"
          here="$(workflows_at "$GITHUB_SHA")"
          target="$sha"; [ -n "$there" ] && [ "$there" = "$here" ] || target="$GITHUB_SHA"
          (cd files && sha256sum -- * > checksums.txt)
          mode=(--prerelease); [ "$RELEASE_TYPE" = "Release" ] && mode=(--latest)
          gh release create "$tag" files/* --repo "$GITHUB_REPOSITORY" --target "$target" "${mode[@]}" \
            --title "$title" --notes-file notes.md
          {
            echo "## Rilis dari run / release from run"
            echo "- 🇮🇩 Terbit: [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) ($RELEASE_TYPE)$([ "$TESTED" = "true" ] && echo ", diuji di HP")"
            echo "- 🇬🇧 Published: [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) ($RELEASE_TYPE)$([ "$TESTED" = "true" ] && echo ", tested on the phone")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Catatan dan teks Telegram / notes and Telegram text
        run: |
          {
            echo "## 📣 Teks Telegram siap salin / Telegram posts ready to copy"
            if [ "$TEXT_ONLY" = "true" ]; then
              echo "- 🇮🇩 Mode teks saja: tidak ada rilis yang diterbitkan atau diubah."
              echo "- 🇬🇧 Text-only mode: no release was published or changed."
            fi
            echo
            cat telegram/summary.md
            echo
            echo '<details><summary>📝 Catatan rilis lengkap / Full release notes — What’s New & Fixes</summary>'
            echo
            cat notes.md
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ringkasan bila gagal / summary on failure
        if: failure() || cancelled()
        run: |
          {
            echo "## ❌ Rilis dari run gagal / Release from run failed"
            echo
            echo "- 🇮🇩 Tidak ada rilis yang diterbitkan. Alasannya ada di pesan error di atas (langkah merah pertama)."
            echo "- 🇬🇧 No release was published. The reason is in the error message above (the first red step)."
          } >> "$GITHUB_STEP_SUMMARY"
