name: Hapus branch ter-merge (sekali pakai)

# Owner 24 Okt 2026 ("Hapus saja"): branch PR #1–#9 tertinggal sebelum "Automatically delete head
# branches" aktif. Dihapus hanya branch yang ujungnya sama dengan head PR yang sudah di-merge dan tidak
# punya PR terbuka; branch default tidak pernah. Branch yang dihapus masih bisa dipulihkan dari halaman
# PR-nya. File ini dihapus setelah dipakai.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: hapus-branch-lama
  cancel-in-progress: false

jobs:
  hapus:
    name: Hapus branch ter-merge
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Hapus / delete
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          owner = repo.split("/")[0]

          def gh(path, method="GET"):
              result = subprocess.run(["gh", "api", "-X", method, path], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit(f"gh api -X {method} {path}: {result.stderr.strip()}")
              return json.loads(result.stdout) if result.stdout.strip() else {}

          default = gh(f"repos/{repo}")["default_branch"]
          rows = []
          for branch in gh(f"repos/{repo}/branches?per_page=100"):
              name, tip = branch["name"], branch["commit"]["sha"]
              if name == default:
                  continue
              pulls = gh(f"repos/{repo}/pulls?state=all&head={owner}:{name}&per_page=100")
              merged = [p for p in pulls if p.get("merged_at") and p["head"]["sha"] == tip]
              if any(p["state"] == "open" for p in pulls):
                  rows.append((name, "dibiarkan: PR terbuka / kept: open PR"))
              elif not merged:
                  rows.append((name, "dibiarkan: belum di-merge atau ada commit baru / kept: not merged or newer commits"))
              else:
                  gh(f"repos/{repo}/git/refs/heads/{name}", "DELETE")
                  rows.append((name, f"dihapus / deleted (PR #{merged[0]['number']})"))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Hapus branch ter-merge\n\n"
                            "🇮🇩 Hanya branch yang ujungnya sama dengan PR yang sudah di-merge; branch default dan PR terbuka tidak disentuh.\n\n"
                            "🇬🇧 Only branches whose tip matches a merged PR; the default branch and open PRs are untouched.\n\n"
                            "| Branch | Hasil / result |\n|---|---|\n"
                            + "".join(f"| `{name}` | {what} |\n" for name, what in rows))
          print("\n".join(f"{name}: {what}" for name, what in rows))
          PY
