name: Arsip rilis (sekali pakai)

# Owner 23 Okt 2026: rilis lama dari cogan17/Kernel-14t-pro disalin ke Releases repo ini sebagai arsip,
# dengan tag, file dan SHA256 yang sama (digest rilis asal dicek per file). Tag yang sudah ada dilewati,
# jadi aman dijalankan ulang. File ini dihapus setelah arsip selesai.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arsip-rilis
  cancel-in-progress: false

jobs:
  arsip:
    name: Salin rilis lama sebagai arsip
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OLD: cogan17/Kernel-14t-pro
      NEW: ${{ github.repository }}
    steps:
      - name: Salin rilis / copy releases
        run: |
          set -euo pipefail
          # Oldest first, so newer releases (and every future build) list above them.
          for tag in v26.10.22-r5 v26.10.22-r6 cogan-smart-v2.8.1 cogan-smart-v2.8.2 v26.10.23-r8; do
            if gh release view "$tag" --repo "$NEW" >/dev/null 2>&1; then
              echo "| \`$tag\` | sudah ada, dilewati / already there, skipped |" >> rows.md
              continue
            fi
            gh api "repos/$OLD/releases/tags/$tag" > old.json
            mkdir -p "files/$tag"
            gh release download "$tag" --repo "$OLD" --dir "files/$tag"
            python3 - "$tag" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          tag = sys.argv[1]
          old = json.load(open("old.json"))
          for asset in old["assets"]:
              data = (Path("files") / tag / asset["name"]).read_bytes()
              digest = "sha256:" + hashlib.sha256(data).hexdigest()
              if digest != asset.get("digest"):
                  raise SystemExit(f"{tag}/{asset['name']}: {digest} != {asset.get('digest')}")
          body = old["body"]
          for a, b in [("https://github.com/cogan17/Kernel-14t-pro/blob/bsp-rothko-u-oss/docs/",
                        "https://github.com/cogan17/Xiomi_14T_Pro/blob/main/docs/"),
                       ("https://github.com/cogan17/Kernel-14t-pro/tree/dev/rothko/modules/cogan-smart",
                        "https://github.com/cogan17/Xiomi_14T_Pro/tree/main/modules/cogan-smart")]:
              body = body.replace(a, b)
          head = (f"> [!NOTE]\n> 📦 **Arsip** dari [cogan17/Kernel-14t-pro]({old['html_url']}), diterbitkan "
                  f"{old['published_at'][:10]}. File dan SHA256 sama persis; ZIP kernel ditandatangani repo asal "
                  "(`gh attestation verify <zip> --repo cogan17/Kernel-14t-pro`).\n"
                  f"> 📦 **Archive** from [cogan17/Kernel-14t-pro]({old['html_url']}), published "
                  f"{old['published_at'][:10]}. Same files and SHA256; kernel ZIPs are signed by the original "
                  "repository.\n\n")
          Path("notes.md").write_text(head + body)
          Path("title.txt").write_text("📦 Arsip · " + old["name"])
          PY
            gh release create "$tag" files/"$tag"/* --repo "$NEW" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$(cat title.txt)" --notes-file notes.md
            echo "| \`$tag\` | disalin / copied ($(ls "files/$tag" | wc -l) file, SHA256 cocok / matches) |" >> rows.md
          done
          {
            echo "## Arsip rilis"
            echo
            echo "🇮🇩 Rilis lama dari \`$OLD\` disalin sebagai arsip (Pre-release, judul \"📦 Arsip\"). Repo asal tidak diubah."
            echo
            echo "🇬🇧 Old releases of \`$OLD\` copied as an archive (Pre-release, title \"📦 Arsip\"). The original repository is unchanged."
            echo
            echo "| Tag | Hasil / result |"
            echo "|---|---|"
            cat rows.md
          } >> "$GITHUB_STEP_SUMMARY"
